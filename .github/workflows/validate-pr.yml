name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write  # needed to post the preview comment

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site (strict — catches broken links & formatting)
        run: mkdocs build --strict --site-dir ./site

      - name: Upload site preview as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-pr${{ github.event.pull_request.number }}
          path: ./site
          retention-days: 7

      - name: Post preview link as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const body = [
              '## 📄 Site Preview',
              '',
              'The MkDocs build succeeded. Download the rendered site to preview it locally:',
              '',
              `**[⬇️ Download site-preview-pr${{ github.event.pull_request.number }} artifact](${artifactUrl})**`,
              '',
              '> Unzip the artifact and open `index.html` in your browser to review with full Material theme styling.',
              '',
              '---',
              '_Posted automatically by the Validate PR workflow. Artifact expires after 7 days._',
            ].join('\n');

            // Find and update an existing bot comment rather than spamming new ones
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## 📄 Site Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
